{# Shared by signup.html and login.html. Each sets form_action + submit_label;
   the route supplies error, email and min_password_length. #}
{% if error %}
<p role="alert" style="color: #b00020">{{ error }}</p>
{% endif %}

<form method="post" action="{{ form_action }}">
  <label>
    Email
    <input type="email" name="email" value="{{ email or '' }}" required />
  </label>
  <label>
    Password
    <input
      type="password"
      name="password"
      {% if require_min_length %}minlength="{{ min_password_length }}"{% endif %}
      required
    />
  </label>
  <button type="submit">{{ submit_label }}</button>
</form>
